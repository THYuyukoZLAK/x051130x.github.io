# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: "THYuyukoZLAK's Gensokyo"

description: "Nice blog of uuz"

# 首屏站名：大字一行、英文一行；下方的一句简介取自上面的 description
brand_name: "白玉楼航空工業"
brand_latin: "Hakugyokurou AeroIndustry"

baseurl: "" # the subpath of your site, e.g. /blog
url: "http://x051130x.github.io" # the base hostname & protocol for your site
github_username: THYuyukoZLAK

plugins:
  - jekyll-paginate
paginate: 10
paginate_path: "/page/:num/"

# 月访问量统计接口（visits.php）。部署到 InfinityFree 等 PHP 环境时，
# 若与站点不同源，请改成完整地址，例如 https://example.infinityfree.me/visits.php
visits_api: "/visits.php"

include:
  - docs/_sidebar.md

exclude:
  - CNAME
  - vendor
  - Gemfile
  - Gemfile.lock
  # PHP 接口需单独部署到支持 PHP 的主机，不随静态站点发布源码
  - visits.php

defaults:
  - scope:
      path: ""
    values:
      toc: true
