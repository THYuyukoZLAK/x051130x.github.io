<div class="identity-row">
    <div class="decr-cornerhoverarea identity-avatar">
        <div class="decr-cornercontainer" style="width: {{ include.avatar_size | default: 120 }}px;">
            <img src="{{ '/img/avatar-placeholder.png' | relative_url }}" width="{{ include.avatar_size | default: 120 }}"
                height="{{ include.avatar_size | default: 120 }}" class="identity-avatar-img"
                alt="站点头像（占位图）" loading="lazy">
            <div class="corner-tl"></div>
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>
            <div class="corner-br"></div>
        </div>
    </div>
    <div class="identity-text">
        <p class="identity-name">VOR Hakugyokurou</p>
        <p class="identity-handle">@西行寺夜和</p>
    </div>
</div>
