---
layout: default
---

<style>
    .timer-line {
        width: 1px;
        height: auto;
        background-color: white;
        margin: 10px 30px 10px 20px;
    }
</style>
<article class="mt-3">
    <div class="container-lg post-layout">
        <div class="row uuz-lg-flex-no-wrap flex-wrap-reverse">
            <div class="col-lg">
                <div class="bg-primary-subtle p-3 p-md-4">
                    <h2 itemprop="name headline">{{ page.title }}</h2>
                    <p class="post-meta">
                        <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
                            {{ page.date | date: "%b %-d, %Y" }}
                        </time>
                        {% if page.author %} • <span itemprop="author">
                            <span itemprop="name">
                                {{ page.author }}
                            </span>
                        </span>
                        {% endif %}
                    </p>
                    <div class="postbody uuz-markdown">
                        {{ content }}
                    </div>
                    
                </div>
            </div>
            <div class="col-lg-3 mb-3 d-flex flex-column flex-nowrap flex-lg-shrink-1 sticky-lg-top sidebar-sticky-top text-wrap align-self-start">
                <div class="post-divider"></div>
                <div class="uuz-post-rhs-sidebar">
                    <!--
                    {% if post.banner %}
                        <img alt="{{ post.title }}" src="{{ post.banner | prepend: site.baseurl }}" class="img-fluid" width="300">
                    {% else %}
                        <img src="/img/guide.webp" class="img-fluid" width="300" height="160" style="visibility: hidden;">
                    {% endif %}
                    -->
                    <div class="top-bg p-3 mb-3 d-none d-lg-block">
                        {% include time.html %}
                    </div>
                    <details class="top-bg post-toc" id="uuz-post-toc-box">
                        <summary>目录</summary>
                        <div class="toc-noborder" id="uuz-post-toc">
                            {% toc %}
                        </div>
                    </details>
                </div>
            </div>
        </div>
    </div>
</article>
<script src="{{ '/js/post-toc.js' | relative_url }}" defer></script>
